name: Run 4PDA Parser

on:
  schedule:
    # Автоматический запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Позволяет запустить вручную через кнопку на GitHub

jobs:
  run-parser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Скачиваем репозиторий
      uses: actions/checkout@v4

    - name: Настраиваем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Запускаем парсер
      run: python parser.py

    - name: Сохраняем обновленный data.json в репозиторий
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --staged --quiet || git commit -m "Автообновление данных [skip ci]"
        git push
