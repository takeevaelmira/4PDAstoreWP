name: Run 4PDA Catalog Parser

on:
  schedule:
    # Запуск каждые 6 часов (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub Actions

jobs:
  build-and-parse:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Права на запись файла data.json в репозиторий

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Настройка среды Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка необходимых библиотек
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: Запуск парсера
      run: python parser.py

    - name: Фиксация изменений и отправка data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --staged --quiet || git commit -m "Auto-update: каталог 4PDA обновлен [skip ci]"
        git push
